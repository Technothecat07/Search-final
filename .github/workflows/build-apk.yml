name: Build SIGNAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair lib/main.dart
        shell: python
        run: |
          import re
          import gzip
          import base64
          from pathlib import Path

          path = Path("lib/main.dart")
          source = path.read_text(encoding="utf-8")

          payloads = {}

          payloads["filters"] = """"""

          payloads["export"] = """"""

          payloads["detail"] = """"""

          payloads["body"] = """"""

          def decode(name):
              return gzip.decompress(
                  base64.b64decode(payloads[name])
              ).decode("utf-8")

          replacements = {
              "filters": (
                  r"  Future<void> _filtersSheet\(\) async \{.*?(?=\n  Future<void> _export)"
              ),
              "export": (
                  r"  Future<void> _export\(\) async \{.*?(?=\n  void _openDetail)"
              ),
              "detail": (
                  r"  void _openDetail\(int i\) \{.*?(?=\n  @override Widget build)"
              ),
              "body": (
                  r"  Widget _body\(\) \{.*?(?=\n\})"
              ),
          }

          for name, pattern in replacements.items():
              fixed = decode(name)
              source, count = re.subn(
                  pattern,
                  lambda m: fixed,
                  source,
                  count=1,
                  flags=re.DOTALL,
              )

              if count != 1:
                  raise RuntimeError(
                      f"Could not repair {name} section in lib/main.dart"
                  )

          # Fix the invalid Dart set declaration if it is still present.
          source = source.replace(
              "final selected=Set<String>{'regno','name','branch'};",
              "final selected = <String>{'regno', 'name', 'branch'};",
          )

          source = source.replace(
              "final selected = Set<String>{'regno','name','branch'};",
              "final selected = <String>{'regno', 'name', 'branch'};",
          )

          path.write_text(source, encoding="utf-8")

          print("lib/main.dart repaired successfully.")

      - name: Generate Android platform files
        run: |
          flutter create \
            --platforms=android \
            --project-name signal_student_search \
            --org com.signalstudentsearch \
            --no-pub \
            .

      - name: Verify source
        run: |
          test -f lib/main.dart
          test -f pubspec.yaml
          echo "Flutter source verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-student-search-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
